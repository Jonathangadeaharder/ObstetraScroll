root: true

exclude:
  - node_modules/**
  - .git/**
  - dist/**
  - build/**
  - coverage/**
  - docs/**
  - .svelte-kit/**
  - .vercel/**
  - .venv/**
  - static/generated-media/**
  - "**/.DS_Store"

rules:
  max-depth:
    max: 5
    exemptions:
      - ".git/**"
      - "node_modules/**"
      - ".svelte-kit/**"
      - ".venv/**"

  max-files-in-dir:
    max: 30

  max-subdirs:
    max: 15

  file-existence:
    "README.md":
      rule: "exists:1"

  disallowed-patterns:
    - "*.tmp"
    - "*.bak"

  github-workflows:
    global:
      disallow-command-masking: true
      disallow-continue-on-error-on-quality: true
      require-required-checks-aggregator: true
    sveltekit:
      coverage:
        branches: 90
        lines: 80
