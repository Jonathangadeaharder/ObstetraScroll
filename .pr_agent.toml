[config]
model = "openai/qwen3.6-27b-mlx"
fallback_models = ["openai/qwen3.6-27b-mlx"]
custom_model_max_tokens = 32768
custom_reasoning_model = true
verbosity_level = 2

[pr_reviewer]
require_tests_review = true
require_can_see_tested_code = true
num_code_suggestions = 5
enable_intro_text = false
enable_help_text = false
extra_instructions = "Focus on Svelte 5 runes correctness ($state, $derived, $effect). Flag missing coverage, unsafe medical content without evidenceStatus gates. Review facts.ts content for clinical accuracy flags."

[pr_description]
generate_ai_title = true
use_bullet_points = true
extra_instructions = "Focus on architectural impact and breaking changes. Note which facts were added/modified."

[pr_improver]
extra_instructions = "Suggest fixes that match existing code style. Prefer Svelte 5 runes ($state, $derived, $effect) over legacy reactivity. Use pnpm not npm. Use biome not eslint/prettier."

[github]
handle_pr_comment_triggers = true
