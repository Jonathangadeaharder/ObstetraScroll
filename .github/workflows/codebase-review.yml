name: Codebase Review

on:
  workflow_dispatch:

jobs:
  review:
    runs-on: self-hosted
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run codebase review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI.KEY: ${{ secrets.CROFAI_API_KEY }}
          OPENAI.API_BASE: https://crof.ai/v1
          CONFIG.MODEL: "openai/glm-5.1"
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          VENV=/tmp/pr-agent-venv-py313
          if [ ! -f "$VENV/bin/python" ]; then
            python3.13 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip
            "$VENV/bin/pip" install pr-agent
          fi

          BRANCH="tmp/codebase-review-$(date +%s)"
          git checkout --orphan "$BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          echo "# Placeholder" > README.md
          git add README.md
          git commit -m "empty"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create --base "$BRANCH" --head "$DEFAULT_BRANCH" --title "Codebase Review $(date -u +%Y-%m-%d)" --body "Automated full codebase review" --json url --jq '.url')

          "$VENV/bin/python" -m pr_agent.cli describe --pr_url="$PR_URL"
          "$VENV/bin/python" -m pr_agent.cli review --pr_url="$PR_URL"

          gh pr close "$PR_URL" -d
          git push origin --delete "$BRANCH" || true
