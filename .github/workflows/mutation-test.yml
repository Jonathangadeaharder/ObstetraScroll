name: Mutation Test (Full)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: mutation-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-mutation:
    name: Full Mutation Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Stryker mutation test
        run: pnpm exec stryker run --incremental --force

      - name: Upload incremental cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-main-${{ github.sha }}
