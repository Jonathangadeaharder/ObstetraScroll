name: Mutation Test (Full)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-mutation:
    name: Full Mutation Test
    runs-on: ["self-hosted", "node", "macos"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full Stryker mutation test
        run: pnpm exec stryker run --incremental --force

      - name: Upload incremental cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-main-${{ github.sha }}
