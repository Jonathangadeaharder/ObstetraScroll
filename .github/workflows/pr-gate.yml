name: PR Gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check for iCloud sync conflicts
        run: |
          if find . -path ./node_modules -prune -o -path ./.git -prune -o -path ./static/generated-media -prune -o -name "* [0-9]*" -print | grep -q .; then
            echo "::error::iCloud sync conflicts detected"
            find . -path ./node_modules -prune -o -path ./.git -prune -o -path ./static/generated-media -prune -o -name "* [0-9]*" -print
            exit 1
          fi

  node-quality:
    name: Node Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run check

      - name: Unit tests with coverage
        run: pnpm vitest run --coverage

      - name: Build
        run: pnpm run build

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infra-validation:
    name: Infra Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate docker-compose.yml
        run: |
          echo "Checking docker-compose.yml exists..."
          test -f docker-compose.yml || { echo "::error::docker-compose.yml missing"; exit 1; }
          echo "Checking ORIGIN env var is present..."
          grep -q 'ORIGIN=' docker-compose.yml || { echo "::error::docker-compose.yml missing ORIGIN env var"; exit 1; }
          echo "Checking Traefik TLS labels present..."
          grep -q 'tls.certresolver=letsencrypt' docker-compose.yml || { echo "::error::docker-compose.yml missing TLS certresolver label"; exit 1; }
          echo "Checking HEALTHCHECK in Dockerfile..."
          test -f Dockerfile || echo "::warning::No Dockerfile found"
          if [ -f Dockerfile ]; then
            grep -q 'HEALTHCHECK' Dockerfile || { echo "::error::Dockerfile missing HEALTHCHECK instruction"; exit 1; }
          fi
          echo "All infra checks passed."

      - name: Validate env var defaults
        run: |
          echo "Checking PostHog host is EU region..."
          if grep -q 'us.posthog.com' docker-compose.yml 2>/dev/null; then
            echo "::error::docker-compose.yml has wrong PostHog host (us, should be eu)"
            exit 1
          fi
          echo "PostHog host check passed."

  mutation-testing:
    name: Mutation Testing (Incremental)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download previous incremental cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: stryker-cache
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.base_ref }}

      - name: Run Stryker incremental
        run: pnpm exec stryker run --incremental

      - name: Upload new incremental cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.base_ref }}-${{ github.sha }}
          restore-keys: |
            stryker-incremental-${{ github.base_ref }}-

  repo-structure:
    name: Repo Structure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - name: Build structurelint
        run: |
          git clone --branch feat/quality-gates --depth 1 https://github.com/Jonathangadeaharder/structurelint.git /tmp/structurelint
          cd /tmp/structurelint && go build -o /usr/local/bin/structurelint ./cmd/structurelint
      - name: Run structurelint
        run: structurelint .

  required-checks:
    name: Required Checks (PR)
    runs-on: ubuntu-latest
    needs:
      - repo-hygiene
      - node-quality
      - dependency-scan
      - secret-scanning
      - infra-validation
      - mutation-testing
      - repo-structure
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.repo-hygiene.result }}" != "success" ] || \
             [ "${{ needs.node-quality.result }}" != "success" ] || \
             [ "${{ needs.dependency-scan.result }}" != "success" ] || \
             [ "${{ needs.secret-scanning.result }}" != "success" ] || \
             [ "${{ needs.infra-validation.result }}" != "success" ] || \
             [ "${{ needs.mutation-testing.result }}" != "success" ] || \
             [ "${{ needs.repo-structure.result }}" != "success" ]; then
            echo "One or more PR gate jobs failed."
            exit 1
          fi
          echo "All PR gate jobs passed."
