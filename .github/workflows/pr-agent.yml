name: PR Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  pr-agent:
    if: ${{ vars.ENABLE_PR_AGENT == 'true' }}
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Run PR Agent
        env:
          GITHUB.USER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI.KEY: ${{ secrets.LM_STUDIO_API_KEY }}
          OPENAI.API_BASE: http://localhost:1234/v1
          OPENAI.API_TYPE: "openai"
          CONFIG.MODEL: "openai/qwen3.6-27b-mlx"
          CONFIG.FALLBACK_MODELS: '["openai/qwen3.6-27b-mlx"]'
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "32768"
          CONFIG.CUSTOM_REASONING_MODEL: "true"
          CONFIG.VERBOSITY_LEVEL: "2"
          CONFIG.AI_TIMEOUT: "300"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          VENV=/tmp/pr-agent-venv-py313
          rm -rf /tmp/pr-agent-venv
          if [ ! -f "$VENV/bin/python" ]; then
            python3.13 -m venv "$VENV"
            "$VENV/bin/pip" install --upgrade pip
            "$VENV/bin/pip" install pr-agent
          fi

          PR_URL="https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "$VENV/bin/python" -m pr_agent.cli --pr_url="$PR_URL" review
          elif echo "$COMMENT_BODY" | grep -q "^/review"; then
            "$VENV/bin/python" -m pr_agent.cli --pr_url="$PR_URL" review
          elif echo "$COMMENT_BODY" | grep -q "^/describe"; then
            "$VENV/bin/python" -m pr_agent.cli --pr_url="$PR_URL" describe
          elif echo "$COMMENT_BODY" | grep -q "^/improve"; then
            "$VENV/bin/python" -m pr_agent.cli --pr_url="$PR_URL" improve
          elif echo "$COMMENT_BODY" | grep -q "^/ask"; then
            QUESTION="${COMMENT_BODY#/ask }"
            "$VENV/bin/python" -m pr_agent.cli --pr_url="$PR_URL" ask "$QUESTION"
          fi
